micronaut.application.name=api
micronaut.serde.write-dates-as-timestamps=false
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET}
micronaut.security.token.generator.access-token.expiration=2592000
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
flyway.datasources.default.enabled=true
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
