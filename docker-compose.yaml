services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-3080}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://db:5432/xiulian
      DATASOURCES_DEFAULT_USERNAME: xiulian
      DATASOURCES_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: xiulian
      POSTGRES_USER: xiulian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiulian"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
